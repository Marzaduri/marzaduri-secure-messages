name = "marzadurisecure"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [
  { pattern = "marzadurisecure.com", custom_domain = true },
  { pattern = "www.marzadurisecure.com", custom_domain = true }
]

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.txt"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "msm"
database_id = "f88cb32d-f048-4fa8-9619-b516f6611a19"

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = false
